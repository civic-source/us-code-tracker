name: External Link Check

on:
  schedule:
    # Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter '!@civic-source/web' build

      - name: Run offline link & builder policy check
        run: pnpm exec tsx scripts/validate-links.ts --mode offline --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run polite live external link check
        run: pnpm exec tsx scripts/validate-links.ts --mode live --summary-file "$GITHUB_STEP_SUMMARY"
