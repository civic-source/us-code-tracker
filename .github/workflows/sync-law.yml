name: Sync US Code

on:
  schedule:
    # Sunday 2:00 AM ET (07:00 UTC during EDT, 06:00 UTC during EST)
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Detect pending OLRC releases without pushing branches/tags or opening PRs'
        required: false
        type: boolean
        default: true
      skip_annotations:
        description: 'Skip CourtListener annotation updates for changed sections'
        required: false
        type: boolean
        default: false
      max_annotations:
        description: 'Maximum changed sections to annotate per sync run'
        required: false
        type: string
        default: '50'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: read-all

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout us-code-tracker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SYNC_DISPATCH_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter '!@civic-source/web' build

      - name: Checkout us-code data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: civic-source/us-code
          path: us-code
          fetch-depth: 0
          token: ${{ secrets.US_CODE_PAT || github.token }}

      - name: Determine sync mode and check/import OLRC releases
        id: sync
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SKIP_ANNOTATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_annotations || false }}
          MAX_ANNOTATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_annotations || '50' }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          HAS_US_CODE_PAT: ${{ secrets.US_CODE_PAT != '' }}
          HAS_SYNC_DISPATCH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN != '' }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            if [ "$HAS_US_CODE_PAT" != "true" ]; then
              echo "::error::Missing secrets.US_CODE_PAT (requires contents:write and pull_requests:write on civic-source/us-code)"
              exit 1
            fi
            if [ "$HAS_SYNC_DISPATCH_TOKEN" != "true" ]; then
              echo "::error::Missing secrets.SYNC_DISPATCH_TOKEN (requires contents:write and pull_requests:write on civic-source/us-code-tracker)"
              exit 1
            fi
          fi
          ARGS=(--repo us-code --output-env "$GITHUB_OUTPUT")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$SKIP_ANNOTATIONS" = "true" ]; then
            ARGS+=(--skip-annotations)
          fi
          if [ -n "$MAX_ANNOTATIONS" ]; then
            ARGS+=(--max-annotations "$MAX_ANNOTATIONS")
          fi
          git -C us-code config user.name "github-actions[bot]"
          git -C us-code config user.email "github-actions[bot]@users.noreply.github.com"
          echo "effective_dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          pnpm exec tsx scripts/sync-latest-release.ts "${ARGS[@]}"

      - name: Push sync branch and open PR in civic-source/us-code
        if: steps.sync.outputs.has_changes == 'true' && steps.sync.outputs.effective_dry_run != 'true'
        id: data_pr
        working-directory: us-code
        env:
          GH_TOKEN: ${{ secrets.US_CODE_PAT }}
          LATEST_RELEASE: ${{ steps.sync.outputs.latest_release }}
          LATEST_SLUG: ${{ steps.sync.outputs.latest_slug }}
          CREATED_TAGS: ${{ steps.sync.outputs.created_tags }}
          DATA_SHA: ${{ steps.sync.outputs.data_sha }}
          SECTIONS_CHANGED: ${{ steps.sync.outputs.sections_changed }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing secrets.US_CODE_PAT (requires contents:write and pull_requests:write on civic-source/us-code)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/sync-${LATEST_SLUG}-${DATA_SHA:0:8}"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH"

          PR_TITLE="chore(law): sync statutes through ${LATEST_RELEASE}"
          PR_BODY="Automated OLRC release sync through **${LATEST_RELEASE}** (\`${DATA_SHA}\`). Sections added/updated: ${SECTIONS_CHANGED}. Release tags generated locally: \`${CREATED_TAGS:-none}\` (kept unpushed until PR merge so unmerged tags never pollute \`origin\` or block reruns; merge via \`gh pr merge --merge\`, never squash, then tag merged commit(s) if publishing release refs)."
          EXISTING=$(gh pr list --repo civic-source/us-code --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo civic-source/us-code --title "$PR_TITLE" --body "$PR_BODY"
            DATA_PR_URL="$EXISTING"
          else
            DATA_PR_URL=$(gh pr create --repo civic-source/us-code --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY")
          fi
          echo "pr_url=$DATA_PR_URL" >> "$GITHUB_OUTPUT"

      - name: Validate data candidate and open submodule pin PR in us-code-tracker
        if: steps.data_pr.outputs.pr_url != ''
        id: tracker_pr
        env:
          GH_TOKEN: ${{ secrets.SYNC_DISPATCH_TOKEN }}
          DATA_SHA: ${{ steps.sync.outputs.data_sha }}
          LATEST_RELEASE: ${{ steps.sync.outputs.latest_release }}
          LATEST_SLUG: ${{ steps.sync.outputs.latest_slug }}
          DATA_PR_URL: ${{ steps.data_pr.outputs.pr_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing secrets.SYNC_DISPATCH_TOKEN (requires contents:write and pull_requests:write on civic-source/us-code-tracker)"
            exit 1
          fi
          pnpm exec tsx scripts/promote-publication.ts --action promote --tracker-repo . --data-repo us-code --ref "$DATA_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/promote-${LATEST_SLUG}-${DATA_SHA:0:8}"
          git checkout -B "$BRANCH"
          git add apps/web/content-data apps/web/public/publication-receipt.json apps/web/public/publication-history.json
          if [ -e apps/web/public/search-shards/manifest.json ]; then
            git add apps/web/public/search-shards/manifest.json
          fi
          if git diff --cached --quiet; then
            echo "No tracker pin changes to open PR for."
            exit 0
          fi
          git commit -m "chore(publication): promote us-code through ${LATEST_RELEASE}"
          git push -u origin "$BRANCH"

          PR_TITLE="chore(publication): promote us-code through ${LATEST_RELEASE}"
          PR_BODY="Promotes validated data commit \`${DATA_SHA}\` (${LATEST_RELEASE}) from ${DATA_PR_URL}. Merge the companion \`civic-source/us-code\` PR using a merge commit (never squash) before merging this PR so \`${DATA_SHA}\` and its \`pl-*\` tags remain on \`main\`."
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body "$PR_BODY"
            TRACKER_PR_URL="$EXISTING"
          else
            TRACKER_PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY")
          fi
          echo "pr_url=$TRACKER_PR_URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        env:
          EFFECTIVE_DRY_RUN: ${{ steps.sync.outputs.effective_dry_run }}
          HAS_CHANGES: ${{ steps.sync.outputs.has_changes }}
          LATEST_RELEASE: ${{ steps.sync.outputs.latest_release }}
          PENDING_RELEASES: ${{ steps.sync.outputs.pending_releases }}
          CREATED_TAGS: ${{ steps.sync.outputs.created_tags }}
          SECTIONS_CHANGED: ${{ steps.sync.outputs.sections_changed }}
          ANNOTATED: ${{ steps.sync.outputs.annotated }}
          ANNOTATION_FAILURES: ${{ steps.sync.outputs.annotation_failures }}
          DATA_PR_URL: ${{ steps.data_pr.outputs.pr_url }}
          TRACKER_PR_URL: ${{ steps.tracker_pr.outputs.pr_url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## US Code Sync Summary

          | Metric | Value |
          | --- | --- |
          | Dry Run | ${EFFECTIVE_DRY_RUN:-true} |
          | Changes Detected | ${HAS_CHANGES:-false} |
          | Latest Release | ${LATEST_RELEASE:-N/A} |
          | Pending Releases | ${PENDING_RELEASES:-none} |
          | Created Tags | ${CREATED_TAGS:-none} |
          | Sections Changed | ${SECTIONS_CHANGED:-0} |
          | Sections Annotated | ${ANNOTATED:-0} |
          | Annotation Failures | ${ANNOTATION_FAILURES:-0} |
          | Data Repo PR | ${DATA_PR_URL:-N/A} |
          | Tracker Promotion PR | ${TRACKER_PR_URL:-N/A} |
          EOF
