name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turborepo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install --frozen-lockfile

      # Build libraries/CLI packages and Astro types without compiling 56k static HTML pages.
      # Full static site build + Pagefind indexing is reserved for deploy-site.yml.
      - name: Build packages & verify Astro bundle
        run: |
          pnpm --filter '!@civic-source/web' build
          pnpm --filter @civic-source/web exec astro sync

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # The repo squash-merges, so the PR title becomes the commit subject that
      # release-please parses. Lint that title (not the individual WIP commits)
      # and enforce it — a malformed title now fails CI rather than silently
      # warning (#234). The title is untrusted input, so it is passed via env and
      # never interpolated into the shell (#229 class).
      - name: Validate PR title (squash-merge subject)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
